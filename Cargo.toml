[package]
name = "zrb"
version = "0.1.1"
edition = "2024"
description = "Incremental ZFS snapshot replication over SSH with resumable transfers and retention-based pruning"
license = "GPL-3.0-only"
authors = ["0xCCF4"]
repository = "https://github.com/0xCCF4/zrb"
homepage = "https://github.com/0xCCF4/zrb"
readme = "README.md"
keywords = ["zfs", "backup", "snapshot", "ssh", "zfs-send"]
categories = ["command-line-utilities", "filesystem"]
exclude = [
    "nix/**",
    "flake.nix",
    "flake.lock",
    ".github/**",
    ".scratch/**",
    "result",
]

[[bin]]
name = "zrb"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_complete_nushell = "4"
clap_mangen = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
sd-notify = "0.5"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "io-util", "io-std", "macros"] }

[dev-dependencies]
tempfile = "3"
