[package]
name = "zrb"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "zrb"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_complete_nushell = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
sd-notify = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
