name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - name: Unit tests
        run: cargo test

  integration:
    name: Integration (ZFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install ZFS 2.3+ from flake devShell
        run: |
          nix develop --command bash -c 'echo "$(dirname "$(which zfs)")" >> "$GITHUB_PATH"'
          sudo modprobe zfs 2>/dev/null || true
      - name: All tests (including ZFS integration)
        run: sudo env "PATH=$PATH" "RUSTUP_HOME=$RUSTUP_HOME" "CARGO_HOME=$CARGO_HOME" cargo test -- --include-ignored

  nix-eval:
    name: Nix module eval tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Eval tests
        run: nix build .#checks.x86_64-linux.module-eval-tests
